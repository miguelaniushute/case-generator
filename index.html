<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案卷材料生成器</title>
    <script src="./libs/jszip.min.js"></script>
    <script src="./libs/FileSaver.min.js"></script>
    <script src="./libs/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
        .container{max-width:900px;margin:0 auto;background:white;border-radius:16px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
        h1{text-align:center;color:#333;margin-bottom:30px}
        .upload-area{border:3px dashed #667eea;border-radius:12px;padding:60px 40px;text-align:center;background:#f8f9ff;cursor:pointer;transition:all .3s;margin-bottom:20px}
        .upload-area:hover{border-color:#764ba2;background:#f0f2ff}
        .upload-icon{font-size:64px;margin-bottom:15px}
        .upload-text{color:#666;font-size:16px}
        .upload-hint{color:#999;font-size:12px;margin-top:10px}
        #fileInput{display:none}
        .file-info{background:#e8f4e8;border-radius:8px;padding:15px;margin-bottom:20px;display:none}
        .file-info.show{display:block}
        .file-info h3{color:#2e7d32;font-size:14px;margin-bottom:10px}
        .file-info ul{color:#555;font-size:13px;padding-left:20px}
        .file-info li{margin-bottom:5px}
        .preview{background:#f5f5f5;border-radius:8px;padding:20px;margin-bottom:20px;display:none;max-height:400px;overflow-y:auto}
        .preview.show{display:block}
        .preview h3{color:#333;margin-bottom:15px}
        .case-item{background:white;border:1px solid #ddd;border-radius:8px;padding:15px;margin-bottom:10px}
        .case-item h4{color:#333;margin-bottom:5px}
        .case-item p{color:#666;font-size:13px;margin:2px 0}
        .btn{padding:16px 32px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;width:100%;margin-top:20px}
        .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(102,126,234,0.4)}
        .btn:disabled{background:#ccc;cursor:not-allowed}
        .progress{margin-top:20px;display:none}
        .progress.show{display:block}
        .progress-bar{height:20px;background:#e0e0e0;border-radius:10px;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(135deg,#667eea,#764ba2);width:0;transition:width .3s}
        .progress-text{text-align:center;margin-top:10px;color:#666;font-size:14px}
        .success-msg{background:#d4edda;color:#155724;padding:20px;border-radius:8px;text-align:center;margin-top:20px;display:none}
        .success-msg.show{display:block}
        .success-msg h3{margin-bottom:10px}
        .help{margin-top:30px;padding:20px;background:#fff9e6;border-radius:8px}
        .help h4{color:#f57c00;margin-bottom:10px}
        .help ul{color:#666;font-size:13px;padding-left:20px}
        .help li{margin-bottom:8px}
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 案卷材料生成器</h1>
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📦</div>
            <div class="upload-text">点击选择ZIP压缩包上传</div>
            <div class="upload-hint">包含：Excel表格 + 截图（多张）</div>
        </div>
        <input type="file" id="fileInput" accept=".zip">
        <div class="file-info" id="fileInfo"><h3>📋 已加载文件</h3><ul id="fileList"></ul></div>
        <div class="preview" id="preview"><h3>📊 提取的案件列表</h3><div id="caseList"></div></div>
        <button class="btn" id="generateBtn" disabled>生成封面和目录</button>
        <div class="progress" id="progress"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div class="progress-text" id="progressText">准备中...</div></div>
        <div class="success-msg" id="successMsg"><h3>✅ 生成完成！</h3><p>文件已自动下载</p></div>
        <div class="help"><h4>💡 使用说明</h4><ul><li>上传包含 <strong>Excel表格</strong> 和 <strong>截图</strong> 的压缩包</li><li>截图需包含文件名列表，系统会自动OCR识别</li><li>支持多张截图，会自动合并识别结果</li></ul></div>
    </div>
    <script>
        let caseData = [];
        let imageGroups = {};
        let ocrFilenames = [];
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileList = document.getElementById('fileList');
        const preview = document.getElementById('preview');
        const caseList = document.getElementById('caseList');
        const generateBtn = document.getElementById('generateBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const successMsg = document.getElementById('successMsg');

        uploadArea.addEventListener('click', function() { fileInput.click(); });
        uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); this.style.borderColor = '#764ba2'; this.style.background = '#f0f2ff'; });
        uploadArea.addEventListener('dragleave', function(e) { e.preventDefault(); this.style.borderColor = '#667eea'; this.style.background = '#f8f9ff'; });
        uploadArea.addEventListener('drop', function(e) { e.preventDefault(); this.style.borderColor = '#667eea'; this.style.background = '#f8f9ff'; const files = e.dataTransfer.files; if (files.length > 0) { handleZip(files[0]); } });
        fileInput.addEventListener('change', function() { if (this.files.length > 0) { handleZip(this.files[0]); } });
        generateBtn.addEventListener('click', generateAll);

        async function handleZip(file) {
            const maxSize = 100 * 1024 * 1024;
            if (file.size > maxSize) {
                const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                alert('文件过大（' + sizeMB + 'MB），请压缩到100MB以下');
                return;
            }
            
            if (!file.name.endsWith('.zip')) {
                alert('请上传ZIP格式压缩包！');
                return;
            }
            
            fileInfo.classList.add('show');
            const sizeMB = (file.size / 1024 / 1024).toFixed(2);
            fileList.innerHTML = '<li>📦 ' + file.name + ' (' + sizeMB + 'MB)</li><li>⏳ 正在解析...</li>';
            
            progress.classList.add('show');
            progressFill.style.width = '5%';
            progressText.textContent = '加载ZIP...';
            
            try {
                const zip = await JSZip.loadAsync(file);
                await parseZip(zip);
                fileList.innerHTML = '<li>✅ 解析完成，已识别 ' + caseData.length + ' 个案件，' + ocrFilenames.length + ' 个文件名</li>';
                generateBtn.disabled = false;
            } catch (err) {
                fileList.innerHTML = '<li>❌ 解析失败：' + err.message + '</li>';
                alert('解压失败：' + err.message);
            }
            progress.classList.remove('show');
        }

        async function parseZip(zip) {
            caseData = [];
            imageGroups = {};
            ocrFilenames = [];
            const allFiles = Object.keys(zip.files);
            
            // 查找所有图片文件（截图）
            const imageFiles = allFiles.filter(f => 
                !f.endsWith('/') && 
                /\.(png|jpg|jpeg|gif|bmp)$/i.test(f)
            ).sort();
            
            console.log('找到', imageFiles.length, '张图片');
            
            // 对每张图片进行OCR识别
            if (imageFiles.length > 0) {
                for (let i = 0; i < imageFiles.length; i++) {
                    const imgFile = imageFiles[i];
                    progressFill.style.width = 10 + (i / imageFiles.length) * 70;
                    progressText.textContent = 'OCR识别第 ' + (i + 1) + '/' + imageFiles.length + ' 张图片...';
                    
                    try {
                        const imageData = await zip.file(imgFile).async('blob');
                        const result = await Tesseract.recognize(imageData, 'chi_sim+eng', {
                            logger: m => { 
                                if (m.status === 'recognizing text') {
                                    const base = 10 + (i / imageFiles.length) * 70;
                                    const add = (m.progress / imageFiles.length) * 20;
                                    progressFill.style.width = (base + add) + '%';
                                }
                            }
                        });
                        
                        const ocrText = result.data.text;
                        console.log('图片' + (i+1) + ' OCR结果:', ocrText);
                        
                        // 解析这张图片的文件名
                        const filenames = parseOcrFilenames(ocrText);
                        ocrFilenames = ocrFilenames.concat(filenames);
                        
                    } catch (err) {
                        console.log('图片' + (i+1) + ' OCR失败:', err.message);
                    }
                }
                
                // 去重
                ocrFilenames = [...new Set(ocrFilenames)];
                progressFill.style.width = '85%';
                progressText.textContent = '识别到 ' + ocrFilenames.length + ' 个文件名';
            }
            
            // 读取Excel
            progressFill.style.width = '90%';
            progressText.textContent = '读取Excel...';
            
            const excelFiles = allFiles.filter(f => !f.endsWith('/') && (f.endsWith('.xlsx') || f.endsWith('.xls')));
            
            for (const excelFile of excelFiles) {
                const content = await zip.file(excelFile).async('arraybuffer');
                const workbook = new ExcelJS.Workbook();
                try {
                    await workbook.xlsx.load(content);
                } catch (err) {
                    console.log('Excel加载错误:', err.message);
                    continue;
                }
                
                const worksheet = workbook.getWorksheet(1) || (workbook.worksheets && workbook.worksheets[0]);
                if (!worksheet) continue;
                
                worksheet.eachRow((row, rowNum) => {
                    if (rowNum <= 1) return;
                    const cells = [];
                    row.eachCell((cell) => {
                        let cellVal = '';
                        try {
                            const val = cell.value;
                            if (typeof val === 'object' && val !== null) {
                                if (val.result !== undefined) cellVal = val.result;
                                else if (val.value !== undefined) cellVal = val.value;
                                else if (val.richText && Array.isArray(val.richText)) cellVal = val.richText.map(x => x.text || '').join('');
                                else if (val.text) cellVal = val.text;
                            } else {
                                cellVal = val;
                            }
                        } catch (e) {
                            cellVal = '';
                        }
                        cells.push(String(cellVal || '').trim());
                    });
                    
                    const 案卷号 = cells[5] || '';
                    if (!案卷号 || !案卷号.startsWith('京')) return;
                    
                    caseData.push({
                        案卷号: 案卷号,
                        权利人原始: cells[7] || '',
                        坐落: cells[8] || '',
                        权证号: cells[6] || '',
                        业务编号: cells[1] || ''
                    });
                });
            }
            
            if (caseData.length === 0) {
                caseData.push({
                    案卷号: '京2026海ZS0000001',
                    权利人原始: 'OCR识别',
                    坐落: '(截图识别)',
                    权证号: '(OCR)',
                    业务编号: ''
                });
            }
            
            // 用OCR文件名构建目录
            const groups = ocrFilenames.map((name, i) => ({
                order: i + 1,
                name: name,
                pages: String(i + 1)
            }));
            imageGroups['截图目录'] = groups;
            for (const c of caseData) {
                c.folder = '截图目录';
            }
            
            progressFill.style.width = '100%';
            showPreview();
        }

        function parseOcrFilenames(text) {
            const filenames = [];
            const lines = text.split('\n').filter(l => l.trim());
            
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                
                // 清理OCR常见错误
                let cleaned = trimmed
                    .replace(/[|Il1][a-zA-Z]/g, '1')
                    .replace(/[O0]/g, '0')
                    .replace(/[。.]+$/, '')
                    .replace(/^[\d.]+\s*/, '')
                    .trim();
                
                // 过滤无效内容
                if (cleaned.length < 2) continue;
                if (/^(jpg|png|jpeg|gif|bmp)$/i.test(cleaned)) continue;
                
                // 提取有效的文件名
                const match = cleaned.match(/(\d+[-_]?.+?)(?:\.(?:png|jpg|jpeg|gif|bmp))?$/i);
                if (match) {
                    let filename = match[1].trim();
                    filename = filename.replace(/[-_]\d+$/, '');
                    if (filename.length > 0 && filename.length < 100) {
                        filenames.push(filename);
                    }
                } else if (cleaned.length > 2 && cleaned.length < 50) {
                    filenames.push(cleaned);
                }
            }
            
            return filenames;
        }

        function showPreview() {
            preview.classList.add('show');
            if (caseData.length === 0) {
                caseList.innerHTML = '<p style="color: #f57c00; padding: 20px;">⚠️ 未识别到案件数据</p>';
                return;
            }
            
            caseList.innerHTML = caseData.map((c, i) => {
                const parsed = parseRightHolder(c.案卷号, c.权利人原始);
                const groups = imageGroups['截图目录'] || [];
                return '<div class="case-item">' +
                    '<h4>' + (i + 1) + '. ' + c.案卷号 + '</h4>' +
                    '<p><strong>权利人：</strong>' + (parsed.leftValue || '(空)') + '</p>' +
                    '<p><strong>义务人：</strong>' + (parsed.rightValue || '(空)') + '</p>' +
                    '<p><strong>识别文件名：</strong>' + groups.length + ' 个</p>' +
                    '<p style="color:#888;font-size:12px;">' + groups.slice(0, 15).map(g => g.name).join('、') + (groups.length > 15 ? '...' : '') + '</p>' +
                '</div>';
            }).join('');
        }

        async function generateAll() {
            if (caseData.length === 0) {
                alert('没有识别的案件数据！');
                return;
            }
            generateBtn.disabled = true;
            progress.classList.add('show');
            successMsg.classList.remove('show');
            const outputZip = new JSZip();
            
            for (let i = 0; i < caseData.length; i++) {
                const c = caseData[i];
                const groups = imageGroups['截图目录'] || [];
                progressText.textContent = '生成中 ' + (i + 1) + '/' + caseData.length + '：' + c.案卷号;
                progressFill.style.width = ((i + 1) / caseData.length * 100) + '%';
                
                const coverExcel = await generateCoverExcel(c, groups);
                outputZip.file('封面——' + c.案卷号 + '.xlsx', coverExcel);
                
                const coverWord = await generateCoverWord(c, groups);
                outputZip.file('目录——' + c.案卷号 + '.docx', coverWord);
                
                await new Promise(r => setTimeout(r, 100));
            }
            
            progressText.textContent = '打包中...';
            const blob = await outputZip.generateAsync({ type: 'blob' });
            saveAs(blob, '案卷材料.zip');
            progress.classList.remove('show');
            successMsg.classList.add('show');
            generateBtn.disabled = false;
        }

        function parseRightHolder(案卷号, 权利人文本) {
            const result = { leftLabel: '权利人', leftValue: '', rightLabel: '义务人', rightValue: '' };
            if (!权利人文本) return result;
            
            if (案卷号.includes('ZS')) {
                const 原权利人 = 权利人文本.match(/原权利人\[([^\]]+)\]/g);
                const 原义务人 = 权利人文本.match(/原义务人\[([^\]]+)\]/g);
                const 转入方 = 权利人文本.match(/转入方\[([^\]]+)\]/g);
                const 转出方 = 权利人文本.match(/转出方\[([^\]]+)\]/g);
                
                if (原权利人 || 原义务人) {
                    if (原权利人) result.leftValue = 原权利人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                    if (原义务人) result.rightValue = 原义务人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                } else if (转入方 || 转出方) {
                    if (转入方) result.leftValue = 转入方.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                    if (转出方) result.rightValue = 转出方.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                }
            } else if (案卷号.includes('ZX') || 案卷号.includes('ZM')) {
                const 抵押权人 = 权利人文本.match(/抵押权人\[([^\]]+)\]/g);
                const 抵押人 = 权利人文本.match(/抵押人\[([^\]]+)\]/g);
                if (抵押权人) result.leftValue = 抵押权人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                if (抵押人) result.rightValue = 抵押人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
            } else if (案卷号.includes('CF')) {
                const 执行人 = 权利人文本.match(/(?<!被)执行人\[([^\]]+)\]/g);
                const 被执行人 = 权利人文本.match(/被执行人\[([^\]]+)\]/g);
                if (执行人) result.leftValue = 执行人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                if (被执行人) result.rightValue = 被执行人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
            }
            return result;
        }

        async function generateCoverExcel(c, groups) {
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('封面');
            
            worksheet.columns = [
                { width: 15 }, { width: 40 }, { width: 20 }, { width: 15 }, { width: 15 }, { width: 20 }
            ];
            
            const parsed = parseRightHolder(c.案卷号, c.权利人原始);
            
            worksheet.getRow(1).getCell('B').value = '案卷号：' + c.案卷号;
            worksheet.getRow(1).getCell('B').font = { size: 14, bold: true };
            worksheet.getRow(3).getCell('C').value = c.坐落 || '';
            worksheet.getRow(4).getCell('C').value = parsed.leftValue || '';
            worksheet.getRow(5).getCell('C').value = c.权证号 || '';
            worksheet.getRow(6).getCell('C').value = parsed.rightValue || '';
            
            const totalTypes = groups.length;
            const totalPages = groups.length;
            worksheet.getRow(7).getCell('E').value = totalTypes;
            worksheet.getRow(7).getCell('F').value = totalPages;
            worksheet.getRow(7).getCell('E').alignment = { vertical: 'top', horizontal: 'center' };
            worksheet.getRow(7).getCell('F').alignment = { vertical: 'top', horizontal: 'center' };
            
            return await workbook.xlsx.writeBuffer();
        }

        async function generateCoverWord(c, groups) {
            let docContent = '目  录\n\n';
            docContent += '案卷号：' + c.案卷号 + '\n';
            const parsed = parseRightHolder(c.案卷号, c.权利人原始);
            docContent += '权利人：' + (parsed.leftValue || '(空)') + '\n';
            docContent += '义务人：' + (parsed.rightValue || '(空)') + '\n\n';
            
            if (groups && groups.length > 0) {
                groups.forEach((g, i) => {
                    docContent += (i + 1) + '. ' + g.name + '\n';
                });
            } else {
                docContent += '（暂无目录内容）\n';
            }
            
            const blob = new Blob([docContent], { type: 'application/msword' });
            return blob;
        }
    </script>
</body>
</html>
