<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案卷材料生成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
        .container{max-width:900px;margin:0 auto;background:white;border-radius:16px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
        h1{text-align:center;color:#333;margin-bottom:30px}
        .upload-area{border:3px dashed #667eea;border-radius:12px;padding:60px 40px;text-align:center;background:#f8f9ff;cursor:pointer;transition:all .3s;margin-bottom:20px}
        .upload-area:hover{border-color:#764ba2;background:#f0f2ff}
        .upload-icon{font-size:64px;margin-bottom:15px}
        .upload-text{color:#666;font-size:16px}
        .upload-hint{color:#999;font-size:12px;margin-top:10px}
        #fileInput{display:none}
        .file-info{background:#e8f4e8;border-radius:8px;padding:15px;margin-bottom:20px;display:none}
        .file-info.show{display:block}
        .file-info h3{color:#2e7d32;font-size:14px;margin-bottom:10px}
        .file-info ul{color:#555;font-size:13px;padding-left:20px}
        .file-info li{margin-bottom:5px}
        .preview{background:#f5f5f5;border-radius:8px;padding:20px;margin-bottom:20px;display:none;max-height:400px;overflow-y:auto}
        .preview.show{display:block}
        .preview h3{color:#333;margin-bottom:15px}
        .case-item{background:white;border:1px solid #ddd;border-radius:8px;padding:15px;margin-bottom:10px}
        .case-item h4{color:#333;margin-bottom:5px}
        .case-item p{color:#666;font-size:13px;margin:2px 0}
        .btn{padding:16px 32px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;width:100%;margin-top:20px}
        .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(102,126,234,0.4)}
        .btn:disabled{background:#ccc;cursor:not-allowed}
        .progress{margin-top:20px;display:none}
        .progress.show{display:block}
        .progress-bar{height:20px;background:#e0e0e0;border-radius:10px;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(135deg,#667eea,#764ba2);width:0;transition:width .3s}
        .progress-text{text-align:center;margin-top:10px;color:#666;font-size:14px}
        .success-msg{background:#d4edda;color:#155724;padding:20px;border-radius:8px;text-align:center;margin-top:20px;display:none}
        .success-msg.show{display:block}
        .success-msg h3{margin-bottom:10px}
        .help{margin-top:30px;padding:20px;background:#fff9e6;border-radius:8px}
        .help h4{color:#f57c00;margin-bottom:10px}
        .help ul{color:#666;font-size:13px;padding-left:20px}
        .help li{margin-bottom:8px}
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 案卷材料生成器</h1>
        <div class="upload-area" id="uploadArea"><div class="upload-icon">📦</div><div class="upload-text">点击选择ZIP压缩包上传</div><div class="upload-hint">包含：Excel表格 + 图片文件夹</div></div>
        <input type="file" id="fileInput" accept=".zip">
        <div class="file-info" id="fileInfo"><h3>📋 已加载文件</h3><ul id="fileList"></ul></div>
        <div class="preview" id="preview"><h3>📊 提取的案件列表</h3><div id="caseList"></div></div>
        <button class="btn" id="generateBtn" disabled>生成封面和目录</button>
        <div class="progress" id="progress"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div class="progress-text" id="progressText">准备中...</div></div>
        <div class="success-msg" id="successMsg"><h3>✅ 生成完成！</h3><p>文件已自动下载</p></div>
        <div class="help"><h4>💡 使用说明</h4><ul><li>上传包含 <strong>Excel表格</strong> 和 <strong>图片文件夹</strong> 的压缩包</li><li>Excel表格需包含：案卷号、权利人、义务人、坐落、权证号等字段</li><li>图片命名格式：<code>序号-资料名称-页号.jpg</code></li><li>系统会自动为每个案件生成封面(Excel)和目录(Word)</li></ul></div>
    </div>
    <script>
        let caseData = [];
        let imageGroups = {};
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileList = document.getElementById('fileList');
        const preview = document.getElementById('preview');
        const caseList = document.getElementById('caseList');
        const generateBtn = document.getElementById('generateBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const successMsg = document.getElementById('successMsg');

        uploadArea.addEventListener('click', function() { fileInput.click(); });
        uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); this.style.borderColor = '#764ba2'; this.style.background = '#f0f2ff'; });
        uploadArea.addEventListener('dragleave', function(e) { e.preventDefault(); this.style.borderColor = '#667eea'; this.style.background = '#f8f9ff'; });
        uploadArea.addEventListener('drop', function(e) { e.preventDefault(); this.style.borderColor = '#667eea'; this.style.background = '#f8f9ff'; const files = e.dataTransfer.files; if (files.length > 0) { handleZip(files[0]); } });
        fileInput.addEventListener('change', function() { if (this.files.length > 0) { handleZip(this.files[0]); } });
        generateBtn.addEventListener('click', generateAll);

        function b64ToArrayBuffer(b64) {
            const bin = atob(b64);
            const len = bin.length;
            const buf = new Uint8Array(len);
            for (let i = 0; i < len; i++) buf[i] = bin.charCodeAt(i);
            return buf.buffer;
        }

        async function handleZip(file) {
            if (!file.name.endsWith('.zip')) {
                alert('请上传ZIP格式压缩包！');
                return;
            }
            fileInfo.classList.add('show');
            fileList.innerHTML = '<li>📦 ' + file.name + '</li><li>⏳ 正在解析...</li>';
            try {
                const zip = await JSZip.loadAsync(file);
                await parseZip(zip);
                fileList.innerHTML = '<li>✅ 解析完成，已识别 ' + caseData.length + ' 个案件</li>';
                generateBtn.disabled = false;
            } catch (err) {
                fileList.innerHTML = '<li>❌ 解析失败：' + err.message + '</li>';
                alert('解压失败：' + err.message);
            }
        }

                // 解析权利人：根据案卷号类型（ZS/ZX/ZM/CF）解析权利人文本
        function parseRightHolder(案卷号, 权利人原始) {
            const result = { 权利人: '', 义务人: '' };
            if (!权利人原始) return result;
            
            if (案卷号.includes('ZS')) {
                // 转让：原权利人/原义务人 或 转入方/转出方
                const 原权利人 = 权利人原始.match(/原权利人\[([^\]]+)\]/g);
                const 原义务人 = 权利人原始.match(/原义务人\[([^\]]+)\]/g);
                const 转入方 = 权利人原始.match(/转入方\[([^\]]+)\]/g);
                const 转出方 = 权利人原始.match(/转出方\[([^\]]+)\]/g);
                
                if (原权利人) result.权利人 = 原权利人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                else if (转入方) result.权利人 = 转入方.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                
                if (原义务人) result.义务人 = 原义务人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                else if (转出方) result.义务人 = 转出方.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                
            } else if (案卷号.includes('ZX') || 案卷号.includes('ZM')) {
                // 抵押：抵押权人/抵押人
                const 抵押权人 = 权利人原始.match(/抵押权人\[([^\]]+)\]/g);
                const 抵押人 = 权利人原始.match(/抵押人\[([^\]]+)\]/g);
                if (抵押权人) result.权利人 = 抵押权人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                if (抵押人) result.义务人 = 抵押人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                
            } else if (案卷号.includes('CF')) {
                // 查封：执行人/被执行人
                const 执行人 = 权利人原始.match(/(?<!被)执行人\[([^\]]+)\]/g);
                const 被执行人 = 权利人原始.match(/被执行人\[([^\]]+)\]/g);
                if (执行人) result.权利人 = 执行人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                if (被执行人) result.义务人 = 被执行人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
            }
            
            return result;
        }

async function parseZip(zip) {
            caseData = [];
            imageGroups = {};
            const allFiles = Object.keys(zip.files);
            const imgFolders = {};
            
            for (const filename of allFiles) {
                if (filename.endsWith('/')) continue;
                const match = filename.match(/^(.+?)\/(\d+)-(.+)-(\d+)\.(jpg|jpeg|png)$/i);
                if (match) {
                    const folder = match[1];
                    const seq = parseInt(match[2]);
                    const name = match[3];
                    const page = parseInt(match[4]);
                    if (!imgFolders[folder]) imgFolders[folder] = [];
                    imgFolders[folder].push({ seq: seq, name: name, page: page, fullPath: filename });
                }
            }
            
            for (const folder of Object.keys(imgFolders)) {
                const images = imgFolders[folder].sort((a, b) => a.seq - b.seq);
                const groups = [];
                let currentName = null;
                let startSeq = null;
                let count = 0;
                for (const img of images) {
                    if (img.name !== currentName) {
                        if (currentName !== null) {
                            groups.push({ order: groups.length + 1, name: currentName, pages: startSeq + '-' + (startSeq + count - 1) });
                        }
                        currentName = img.name;
                        startSeq = img.seq;
                        count = 1;
                    } else {
                        count++;
                    }
                }
                if (currentName !== null) {
                    groups.push({ order: groups.length + 1, name: currentName, pages: startSeq + '-' + (startSeq + count - 1) });
                }
                imageGroups[folder] = groups;
            }
            
            const excelFiles = allFiles.filter(f => !f.endsWith('/') && (f.endsWith('.xlsx') || f.endsWith('.xls')));
            for (const excelFile of excelFiles) {
                const content = await zip.file(excelFile).async('arraybuffer');
                const workbook = new ExcelJS.Workbook();
                try {
                    await workbook.xlsx.load(content);
                } catch (err) {
                    continue;
                }
                const worksheet = workbook.getWorksheet(1);
                if (!worksheet) continue;
                
                worksheet.eachRow((row, rowNum) => {
                    if (rowNum <= 1) return;
                    const cells = [];
                    row.eachCell((cell, colNum) => {
                        const val = cell.value;
                        let cellVal = '';
                        if (typeof val === 'object' && val !== null) {
                            if (val.result !== undefined) cellVal = val.result;
                            else if (val.value !== undefined) cellVal = val.value;
                            else if (val.richText && Array.isArray(val.richText)) cellVal = val.richText.map(x => x.text || '').join('');
                            else if (val.text) cellVal = val.text;
                        } else {
                            cellVal = val;
                        }
                        cells.push(String(cellVal || '').trim());
                    });
                    const caseNumber = cells[5] || '';
                    if (!caseNumber || caseNumber.length < 5 || caseNumber.startsWith('案卷号') || !caseNumber.startsWith('京')) return;
                    const parsed = parseRightHolder(caseNumber, cells[7] || '');
                    caseData.push({
                        案卷号: caseNumber,
                        权利人: parsed.权利人,
                        义务人: parsed.义务人,
                        权利人原始: cells[7] || '',
                        坐落: cells[8] || '',
                        权证号: cells[6] || '',
                        folder: null
                    });
                });
            }
            
            const folders = Object.keys(imageGroups);
            if (folders.length === 1) {
                const folder = folders[0];
                for (const c of caseData) { c.folder = ocrFilenames.length > 0 ? '截图目录' : folder; }
            }
            showPreview();
        }


        function parseOcrFilenames(text) {
            const filenames = [];
            const lines = text.split('\n').filter(l => l.trim());
            
            for (const line of lines) {
                // 清理OCR常见的误识别
                let cleaned = line.trim()
                    .replace(/[|Il1][a-zA-Z]/g, '1')
                    .replace(/[O0]/g, '0')
                    .replace(/[。.]+$/, '')
                    .replace(/^[\d.]+\s*/, '')
                    .trim();
                
                if (cleaned.length < 2) continue;
                
                // 去掉扩展名
                cleaned = cleaned.replace(/\.(?:png|jpg|jpeg|gif|bmp|pdf|doc|docx)$/i, '');
                // 去掉末尾页码
                cleaned = cleaned.replace(/[-_]\d+$/, '');
                
                if (cleaned.length >= 2 && cleaned.length < 200) {
                    filenames.push(cleaned);
                }
            }
            
            return [...new Set(filenames)];
        }

        function showPreview() {
            preview.classList.add('show');
            if (caseData.length === 0) {
                caseList.innerHTML = '<p style="color: #f57c00; padding: 20px;">⚠️ 未识别到案件数据</p>';
                return;
            }
            caseList.innerHTML = caseData.map((c, i) =>
                '<div class="case-item"><h4>' + (i + 1) + '. ' + c.案卷号 + '</h4>' +
                '<p>权利人：' + (c.权利人 || '(空)') + ' | 义务人：' + (c.义务人 || '(空)') + '</p>' +
                '<p>坐落：' + ((c.坐落 || '(空)').substring(0, 30)) + '</p>' +
                '<p>权证号：' + (c.权证号 || '(空)') + '</p></div>'
            ).join('');
        }

        async function generateAll() {
            if (caseData.length === 0) {
                alert('没有识别的案件数据！');
                return;
            }
            generateBtn.disabled = true;
            progress.classList.add('show');
            successMsg.classList.remove('show');
            const outputZip = new JSZip();
            
            for (let i = 0; i < caseData.length; i++) {
                const c = caseData[i];
                const groups = imageGroups[c.folder] || [];
                progressText.textContent = '生成中 ' + (i + 1) + '/' + caseData.length + '：' + c.案卷号;
                progressFill.style.width = ((i + 1) / caseData.length * 100) + '%';
                const coverExcel = await generateCoverExcel(c, groups);
                outputZip.file('封面——' + c.案卷号 + '.xlsx', coverExcel);
                const coverWord = await generateCoverWord(c, groups);
                outputZip.file('目录——' + c.案卷号 + '.docx', coverWord);
                await new Promise(r => setTimeout(r, 100));
            }
            
            progressText.textContent = '打包中...';
            const blob = await outputZip.generateAsync({ type: 'blob' });
            saveAs(blob, '案卷材料.zip');
            progress.classList.remove('show');
            successMsg.classList.add('show');
            generateBtn.disabled = false;
        }

        async function generateCoverWord(c, groups) {
            const today = new Date().toISOString().split('T')[0];
            
            function makeCell(text, width, fontSize, bold) {
                const boldTag = bold ? '<w:b/>' : '';
                return '<w:tc><w:tcPr><w:tcW w:w="' + width + '" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="宋体" w:eastAsia="宋体" w:hAnsi="宋体"/>' + boldTag + '<w:sz w:val="' + fontSize + '"/></w:rPr><w:t>' + text + '</w:t></w:r></w:p></w:tc>';
            }
            
            const rowHeight = 500;
            const headerFontSize = 28;
            const dataFontSize = 22;
            const colWidths = [2000, 4000, 1600, 1600];
            
            let rows = '<w:tr><w:trPr><w:trHeight w:val="' + rowHeight + '" w:hRule="atLeast"/></w:trPr>' +
                makeCell("顺序号", colWidths[0], headerFontSize, true) +
                makeCell("资料名称", colWidths[1], headerFontSize, true) +
                makeCell("页号", colWidths[2], headerFontSize, true) +
                makeCell("备注", colWidths[3], headerFontSize, true) +
                '</w:tr>';
            
            for (const g of groups) {
                rows += '<w:tr><w:trPr><w:trHeight w:val="' + rowHeight + '" w:hRule="atLeast"/></w:trPr>' +
                    makeCell(String(g.order), colWidths[0], dataFontSize, false) +
                    makeCell(g.name, colWidths[1], dataFontSize, false) +
                    makeCell(g.pages, colWidths[2], dataFontSize, false) +
                    makeCell('', colWidths[3], dataFontSize, false) +
                    '</w:tr>';
            }
            
            const emptyRows = 17 - 1 - groups.length;
            for (let i = 0; i < emptyRows; i++) {
                rows += '<w:tr><w:trPr><w:trHeight w:val="' + rowHeight + '" w:hRule="atLeast"/></w:trPr>' +
                    '<w:tc><w:tcPr><w:tcW w:w="2000" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr><w:p/></w:tc>'.repeat(4) +
                    '</w:tr>';
            }
            
            const docXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' +
                '<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="200"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="宋体" w:eastAsia="宋体" w:hAnsi="宋体"/><w:sz w:val="47"/></w:rPr><w:t>卷  内  资  料  目  录</w:t></w:r></w:p>' +
                '<w:p><w:pPr><w:jc w:val="right"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="宋体" w:eastAsia="宋体" w:hAnsi="宋体"/><w:sz w:val="22"/></w:rPr><w:t>案卷号：' + c.案卷号 + '</w:t></w:r></w:p>' +
                '<w:p/>' +
                '<w:tbl><w:tblPr><w:tblW w:w="8630" w:type="dxa"/><w:jc w:val="center"/><w:tblLayout w:type="fixed"/><w:tblBorders>' +
                '<w:top w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:left w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:right w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="auto"/>' +
                '</w:tblBorders></w:tblPr><w:tblGrid>' +
                '<w:gridCol w:w="' + colWidths[0] + '"/><w:gridCol w:w="' + colWidths[1] + '"/><w:gridCol w:w="' + colWidths[2] + '"/><w:gridCol w:w="' + colWidths[3] + '"/>' +
                '</w:tblGrid>' + rows +
                '</w:tbl>' +
                '<w:p><w:r><w:rPr><w:rFonts w:ascii="宋体" w:eastAsia="宋体" w:hAnsi="宋体"/><w:sz w:val="24"/></w:rPr><w:t>制作日期：' + today + '                           第1页，共1页</w:t></w:r></w:p>' +
                '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1805" w:bottom="1440" w:left="1805"/></w:sectPr>' +
                '</w:body></w:document>';
            
            const zip = new JSZip();
            zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
            zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
            zip.file('word/document.xml', docXml);
            zip.file('word/_rels/document.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>');
            
            return await zip.generateAsync({ type: 'blob' });
        }
    </script>
