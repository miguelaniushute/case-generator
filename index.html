<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案卷材料生成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
        .container{max-width:900px;margin:0 auto;background:white;border-radius:16px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
        h1{text-align:center;color:#333;margin-bottom:20px}
        h3{color:#333;margin-bottom:10px}
        .step{margin-bottom:20px;padding:20px;background:#f8f9ff;border-radius:8px}
        .upload-area{border:3px dashed #667eea;border-radius:12px;padding:40px;text-align:center;background:#fff;cursor:pointer;transition:all .3s}
        .upload-area:hover{border-color:#764ba2;background:#f0f2ff}
        .upload-icon{font-size:48px;margin-bottom:10px}
        .upload-text{color:#666;font-size:16px}
        .upload-hint{color:#999;font-size:12px;margin-top:8px}
        .file-info{background:#e8f4e8;border-radius:8px;padding:15px;margin-bottom:20px;display:none}
        .file-info.show{display:block}
        .file-info h3{color:#2e7d32;font-size:14px;margin-bottom:10px}
        .file-info ul{color:#555;font-size:13px;padding-left:20px}
        .file-info li{margin-bottom:5px}
        .preview{background:#f5f5f5;border-radius:8px;padding:20px;margin-bottom:20px;display:none}
        .preview.show{display:block}
        .preview h3{color:#333;margin-bottom:15px}
        .btn{padding:16px 32px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;width:100%;margin-top:20px}
        .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(102,126,234,0.4)}
        .btn:disabled{background:#ccc;cursor:not-allowed}
        .progress{margin-top:20px;display:none}
        .progress.show{display:block}
        .progress-bar{height:20px;background:#e0e0e0;border-radius:10px;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(135deg,#667eea,#764ba2);width:0;transition:width .3s}
        .progress-text{text-align:center;margin-top:10px;color:#666;font-size:14px}
        .success-msg{background:#d4edda;color:#155724;padding:20px;border-radius:8px;text-align:center;margin-top:20px;display:none}
        .success-msg.show{display:block}
        .help{margin-top:30px;padding:20px;background:#fff9e6;border-radius:8px}
        .help h4{color:#f57c00;margin-bottom:10px}
        .help ul{color:#666;font-size:13px;padding-left:20px}
        .help li{margin-bottom:8px}
    </style>
</head>
<body>
    <div class="container">
        <h1>案卷材料生成器</h1>
        
        <div class="step">
            <h3>步骤1：上传Excel</h3>
            <div class="upload-area" id="excelArea">
                <div class="upload-icon">📊</div>
                <div class="upload-text">点击上传表格.xlsx</div>
            </div>
            <input type="file" id="excelInput" accept=".xlsx,.xls" style="display:none">
        </div>
        
        <div class="step">
            <h3>步骤2：选择图片文件夹</h3>
            <div class="upload-area" id="folderArea">
                <div class="upload-icon">📂</div>
                <div class="upload-text">点击选择图片文件夹</div>
                <div class="upload-hint">包含：001-资料名称-页码.jpg 格式的图片</div>
            </div>
        </div>
        
        <div class="file-info" id="fileInfo">
            <h3>已加载</h3>
            <ul id="fileList"></ul>
        </div>
        
        <div class="preview" id="preview">
            <h3>识别的案件信息</h3>
            <div id="caseInfo"></div>
        </div>
        
        <button class="btn" id="generateBtn" disabled>生成封面和目录</button>
        
        <div class="progress" id="progress">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">准备中...</div>
        </div>
        
        <div class="success-msg" id="successMsg">
            <h3>生成完成！</h3>
            <p>文件已自动下载</p>
        </div>
        
        <div class="help">
            <h4>使用说明</h4>
            <ul>
                <li>步骤1：上传Excel表格（表格.xlsx）</li>
                <li>步骤2：选择一个图片文件夹（一个案件的所有图片）</li>
                <li>图片命名格式：<code>001-资料名称-页码.jpg</code></li>
                <li>系统会自动用文件夹名（提取数字）匹配Excel中的业务编号</li>
            </ul>
        </div>
    </div>
    
    <script>
        // 全局变量
        let excelFile = null;
        let folderName = '';
        let imageFiles = [];
        let caseData = null;
        
        // DOM元素
        const excelArea = document.getElementById('excelArea');
        const excelInput = document.getElementById('excelInput');
        const folderArea = document.getElementById('folderArea');
        const fileInfo = document.getElementById('fileInfo');
        const fileList = document.getElementById('fileList');
        const preview = document.getElementById('preview');
        const caseInfo = document.getElementById('caseInfo');
        const generateBtn = document.getElementById('generateBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const successMsg = document.getElementById('successMsg');
        
        // 步骤1：上传Excel
        excelArea.addEventListener('click', () => excelInput.click());
        excelInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                excelFile = e.target.files[0];
                console.log('Excel已选择:', excelFile.name);
                updateFileInfo();
            }
        });
        
        // 步骤2：选择图片文件夹
        folderArea.addEventListener('click', async () => {
            try {
                const dirHandle = await window.showDirectoryPicker();
                folderName = dirHandle.name;
                imageFiles = [];
                
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'file') {
                        const fileName = entry.name;
                        if (/\.(png|jpg|jpeg|gif|bmp)$/i.test(fileName)) {
                            imageFiles.push({
                                name: fileName,
                                file: await entry.getFile()
                            });
                        }
                    }
                }
                
                console.log('文件夹已选择:', folderName);
                console.log('图片数量:', imageFiles.length);
                updateFileInfo();
                
                if (excelFile && imageFiles.length > 0) {
                    await parseData();
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    alert('选择文件夹失败: ' + err.message);
                }
            }
        });
        
        // 更新文件信息显示
        function updateFileInfo() {
            fileInfo.classList.add('show');
            fileList.innerHTML = '';
            
            if (excelFile) {
                fileList.innerHTML += '<li>📊 Excel: ' + excelFile.name + '</li>';
            } else {
                fileList.innerHTML += '<li style="color:#f57c00">⚠️ 请上传Excel</li>';
            }
            
            if (folderName) {
                fileList.innerHTML += '<li>📂 文件夹: ' + folderName + '</li>';
                fileList.innerHTML += '<li>🖼️ 图片: ' + imageFiles.length + '张</li>';
            } else {
                fileList.innerHTML += '<li style="color:#f57c00">⚠️ 请选择图片文件夹</li>';
            }
        }
        
        // 解析数据
        async function parseData() {
            console.log('开始解析数据...');
            
            // 1. 解析图片文件名生成目录
            const imgRecords = [];
            for (const img of imageFiles) {
                const match = img.name.match(/^(\d+)-(.+)-(\d+)\.(png|jpg|jpeg|gif|bmp)$/i);
                if (match) {
                    imgRecords.push({
                        seq: parseInt(match[1]),
                        name: match[2],
                        page: parseInt(match[3])
                    });
                }
            }
            
            imgRecords.sort((a, b) => a.seq - b.seq);
            
            // 合并连续页数
            const groups = [];
            let currentName = null;
            let startSeq = null;
            let count = 0;
            
            for (const img of imgRecords) {
                if (img.name !== currentName) {
                    if (currentName !== null) {
                        groups.push({
                            order: groups.length + 1,
                            name: currentName,
                            pages: startSeq + '-' + (startSeq + count - 1)
                        });
                    }
                    currentName = img.name;
                    startSeq = img.seq;
                    count = 1;
                } else {
                    count++;
                }
            }
            if (currentName !== null) {
                groups.push({
                    order: groups.length + 1,
                    name: currentName,
                    pages: startSeq + '-' + (startSeq + count - 1)
                });
            }
            
            console.log('目录解析完成:', groups.length, '种资料');
            
            // 2. 解析Excel匹配数据
            try {
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(excelFile);
                const worksheet = workbook.getWorksheet(1);
                
                if (!worksheet) {
                    alert('Excel解析失败');
                    return;
                }
                
                // 从文件夹名提取数字
                const folderNum = folderName.match(/^(\d+)/);
                if (!folderNum) {
                    alert('文件夹名格式错误，无法提取数字');
                    return;
                }
                const targetId = folderNum[1];
                console.log('文件夹名提取数字:', targetId);
                
                // 遍历Excel查找匹配行
                let found = false;
                for (let rowNum = 2; rowNum <= worksheet.rowCount; rowNum++) {
                    const row = worksheet.getRow(rowNum);
                    if (!row) continue;
                    
                    const cells = [];
                    for (let colNum = 1; colNum <= 10; colNum++) {
                        const cell = row.getCell(colNum);
                        const val = cell.value;
                        let cellVal = '';
                        if (typeof val === 'object' && val !== null) {
                            if (val.result !== undefined) cellVal = val.result;
                            else if (val.value !== undefined) cellVal = val.value;
                            else if (val.richText) cellVal = val.richText.map(x => x.text || '').join('');
                            else if (val.text) cellVal = val.text;
                        } else {
                            cellVal = val || '';
                        }
                        cells.push(String(cellVal).trim());
                    }
                    
                    // 列索引: A(0)=序号, B(1)=业务编号, F(5)=案卷号, G(6)=权证号, H(7)=权利人, I(8)=义务人, J(9)=坐落
                    const 业务编号 = cells[1];
                    
                    if (业务编号 === targetId) {
                        const 案卷号 = cells[5] || '';
                        const parsed = parseRightHolder(案卷号, cells[7] || '');
                        
                        caseData = {
                            序号: cells[0] || '',
                            业务编号: 业务编号,
                            案卷号: 案卷号,
                            权利人: parsed.权利人 || cells[7] || '',
                            义务人: parsed.义务人 || cells[8] || '',
                            权证号: cells[6] || '',
                            坐落: cells[9] || '',
                            folder: folderName,
                            groups: groups
                        };
                        
                        found = true;
                        console.log('匹配成功:', 业务编号, 案卷号);
                        break;
                    }
                }
                
                if (found) {
                    showPreview();
                    generateBtn.disabled = false;
                    fileList.innerHTML += '<li style="color:#2e7d32">✅ 匹配成功！</li>';
                } else {
                    fileList.innerHTML += '<li style="color:#f57c00">❌ 未找到匹配的业务编号: ' + targetId + '</li>';
                }
                
            } catch (err) {
                console.error('Excel解析失败:', err);
                fileList.innerHTML += '<li style="color:#f57c00">❌ Excel解析失败</li>';
            }
        }
        
        // 解析权利人
        function parseRightHolder(案卷号, 权利人原始) {
            const result = { 权利人: '', 义务人: '' };
            if (!权利人原始) return result;
            
            if (案卷号.includes('ZS')) {
                const 原权利人 = 权利人原始.match(/原权利人\[([^\]]+)\]/g);
                const 原义务人 = 权利人原始.match(/原义务人\[([^\]]+)\]/g);
                if (原权利人) result.权利人 = 原权利人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                if (原义务人) result.义务人 = 原义务人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
            } else if (案卷号.includes('ZX') || 案卷号.includes('ZM')) {
                const 抵押权人 = 权利人原始.match(/抵押权人\[([^\]]+)\]/g);
                const 抵押人 = 权利人原始.match(/抵押人\[([^\]]+)\]/g);
                if (抵押权人) result.权利人 = 抵押权人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
                if (抵押人) result.义务人 = 抵押人.map(m => m.match(/\[([^\]]+)\]/)[1]).join('、');
            }
            
            return result;
        }
        
        // 显示预览
        function showPreview() {
            preview.classList.add('show');
            
            const totalPages = caseData.groups.length > 0 ? 
                parseInt(caseData.groups[caseData.groups.length - 1].pages.split('-')[1]) : 0;
            
            caseInfo.innerHTML = 
                '<p><strong>案卷号:</strong> ' + caseData.案卷号 + '</p>' +
                '<p><strong>权利人:</strong> ' + caseData.权利人 + '</p>' +
                '<p><strong>义务人:</strong> ' + caseData.义务人 + '</p>' +
                '<p><strong>坐落:</strong> ' + (caseData.坐落.substring(0, 50) || '') + '</p>' +
                '<p><strong>权证号:</strong> ' + caseData.权证号 + '</p>' +
                '<p><strong>目录:</strong> ' + caseData.groups.length + '种资料，共' + totalPages + '页</p>';
        }
        
        // 生成封面和目录
        generateBtn.addEventListener('click', async () => {
            if (!caseData) return;
            
            generateBtn.disabled = true;
            progress.classList.add('show');
            successMsg.classList.remove('show');
            
            progressText.textContent = '生成封面...';
            progressFill.style.width = '30%';
            
            const coverExcel = await generateCoverExcel(caseData);
            
            progressText.textContent = '生成目录...';
            progressFill.style.width = '60%';
            
            const coverWord = await generateCoverWord(caseData);
            
            progressText.textContent = '打包...';
            progressFill.style.width = '90%';
            
            const outputZip = new JSZip();
            outputZip.file('封面.xlsx', coverExcel);
            outputZip.file('目录.docx', coverWord);
            
            const blob = await outputZip.generateAsync({ type: 'blob' });
            saveAs(blob, '案卷材料.zip');
            
            progress.classList.remove('show');
            successMsg.classList.add('show');
            generateBtn.disabled = false;
        });
        
        // 生成封面Excel（简化版）
        async function generateCoverExcel(c) {
            const workbook = new ExcelJS.Workbook();
            const ws = workbook.addWorksheet('封面');
            
            ws.addRow(['案卷号：' + c.案卷号]);
            ws.addRow([]);
            ws.addRow(['坐落', c.坐落]);
            ws.addRow(['权利人', c.权利人]);
            ws.addRow(['权证号', c.权证号]);
            ws.addRow(['义务人', c.义务人]);
            ws.addRow(['文件数', c.groups.length]);
            
            const totalPages = c.groups.length > 0 ? 
                parseInt(c.groups[c.groups.length - 1].pages.split('-')[1]) : 0;
            ws.addRow(['总页数', totalPages]);
            
            const buf = await workbook.xlsx.writeBuffer();
            return buf;
        }
        
        // 生成目录Word（简化版）
        async function generateCoverWord(c) {
            let content = c.案卷号 + '\n\n目录\n\n';
            for (const g of c.groups) {
                content += g.order + '. ' + g.name + ' (' + g.pages + '页)\n';
            }
            
            const blob = new Blob([content], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
            return blob;
        }
    </script>
</body>
</html>
